   <g id="text_1">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: middle; fill: #222222" x="216" y="15.696328" transform="rotate(-0 216 15.696328)">What each contribution establishes</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 9.7px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #2166ac" x="14.4" y="53.871539" transform="rotate(-0 14.4 53.871539)">C1  Admission contract</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(14.4 71.283694)">Preserves proposal and human</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(14.4 82.372439)">value authority in one successor.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #555555" transform="translate(14.4 103.372092)">Exact candidate + authorized value</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #555555" transform="translate(14.4 113.63033)">+ complete field-source lineage</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9.7px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #762a83" x="237.6" y="53.871539" transform="rotate(-0 237.6 53.871539)">C2  Conditional characterization</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(237.6 72.227756)">Shows which omissions hide</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(237.6 82.43033)">each declared failure family.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #555555" transform="translate(237.6 102.541584)">Paired histories / Proposition 1</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #555555" transform="translate(237.6 114.516501)">Within the declared observation model</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 9.7px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #1b7837" x="14.4" y="154.671539" transform="rotate(-0 14.4 154.671539)">C3  Realization checks</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(14.4 173.027756)">Checks the contract in a model</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(14.4 183.228103)">and the persisted implementation.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #555555" transform="translate(14.4 203.28592)">Alloy, projections and fault tests</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #555555" transform="translate(14.4 214.485994)">Bounded; implementation-specific</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9.7px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #995a14" x="237.6" y="153.709875" transform="rotate(-0 237.6 153.709875)">C4  Cost and agent observations</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(237.6 172.141584)">Characterizes cost and separates</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(237.6 183.23033)">task behavior from host authority.</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #555555" transform="translate(237.6 203.28592)">Persistence / trace / agent workloads</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #555555" transform="translate(237.6 215.316501)">Fixed environment and restricted tools</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 9.7px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #222222" x="14.4" y="261.709875" transform="rotate(-0 14.4 261.709875)">C5  Standard-practice boundary</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #222222" x="14.4" y="285.600234" transform="rotate(-0 14.4 285.600234)">Value-audit and enriched-context controls isolate exact review linkage.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #555555" x="14.4" y="307.126641" transform="rotate(-0 14.4 307.126641)">Distinct identities can remain equivalent under recorded review observations.</text>
   </g>
   <g id="text_17">
    <text style="font-size: 9px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: middle; fill: #222222" x="216" y="335.873906" transform="rotate(-0 216 335.873906)">Reproducibility: raw records -&gt; normalized inputs -&gt; reported outputs</text>
   </g>
  </g>
