   <g id="text_1">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: middle; fill: #222222" x="216" y="14.721797" transform="rotate(-0 216 14.721797)">What each contribution establishes</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 9.7px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #2166ac" x="14.4" y="52.914422" transform="rotate(-0 14.4 52.914422)">C1  Admission contract</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(14.4 71.606221)">Preserves proposal and human</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(14.4 81.994248)">value authority in one successor.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #555555" transform="translate(14.4 102.733857)">Exact candidate + authorized value</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #555555" transform="translate(14.4 113.266611)">+ complete field-source lineage</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9.7px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #762a83" x="237.6" y="52.914422" transform="rotate(-0 237.6 52.914422)">C2  Conditional characterization</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(237.6 71.533857)">Shows which omissions hide</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(237.6 82.066611)">each declared failure family.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #555555" transform="translate(237.6 102.919775)">Paired histories / Proposition 1</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #555555" transform="translate(237.6 113.307803)">Within the declared observation model</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 9.7px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #1b7837" x="14.4" y="153.714422" transform="rotate(-0 14.4 153.714422)">C3  Realization checks</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(14.4 172.461885)">Checks the contract in a model</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(14.4 182.849912)">and the persisted implementation.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #555555" transform="translate(14.4 203.591748)">Alloy, projections and fault tests</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #555555" transform="translate(14.4 214.23583)">Bounded; implementation-specific</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9.7px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #995a14" x="237.6" y="153.709875" transform="rotate(-0 237.6 153.709875)">C4  Cost and agent observations</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(237.6 172.391748)">Characterizes cost and separates</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(237.6 182.924502)">task behavior from host authority.</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #555555" transform="translate(237.6 203.664111)">Persistence / trace / agent workloads</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #555555" transform="translate(237.6 214.163467)">Fixed environment and restricted tools</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: middle; fill: #222222" x="216" y="252.000234" transform="rotate(-0 216 252.000234)">Reproducibility: raw records → normalized inputs → reported outputs</text>
   </g>
