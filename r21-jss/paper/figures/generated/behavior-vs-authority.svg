<title id="figure-title">Behavioral variation with authority invariance</title>
<desc id="figure-desc">Panel a shows exact count-over-evaluable-denominator behavior rates for three qualified configurations. Panel b separately shows 720 fixed invalid-tuple admission calls and 179 capability-unavailable checks, each with zero unauthorized mutations. Ninety-three runtime failures are reported separately.</desc>
