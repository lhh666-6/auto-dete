[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-form-demo"
version = "0.1.0"
description = "Windows-local industrial production form collection demo"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.13,<2",
    "numpy>=1.26,<2",
    "openpyxl>=3.1,<4",
    "opencv-python-headless>=4.10,<4.12",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.36,<2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.3,<10",
    "ruff>=0.6,<1",
    "types-openpyxl>=3.1.5.20260518",
]
research = [
    "matplotlib>=3.9,<4",
    "scikit-learn>=1.5,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deterministic from a clean checkout: resolves `tests.helpers.*` imports
# without an undocumented PYTHONPATH workaround.
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app", "config"]

[tool.setuptools.packages.find]
include = ["app*", "benchmarks*", "config*"]
