[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-decte-agent-authority-benchmark"
version = "0.2.0"
description = "Provider-neutral repeated live-agent authority benchmark"
requires-python = ">=3.11,<3.12"
dependencies = ["mcp==1.27.0", "scipy==1.17.1"]

[dependency-groups]
dev = ["pytest==9.0.3", "ruff==0.15.21"]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools.packages.find]
include = ["auto_decte_agent_benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
